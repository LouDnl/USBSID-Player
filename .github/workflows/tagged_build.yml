name: USBSID-Player Tagged Build

permissions:
  contents: write

on:
  push:
    tags:
      - 'd[0-9]*'   # a date, d20261024 and so on. Not v*: that is release.yml
  # Allows you to run this workflow manually from the Actions tab when needed
  workflow_dispatch:

jobs:

  ### The same build matrix and packaging as an official release. release.yml
  ### is called rather than copied, so a tagged build ships the same assets as
  ### a release and the two cannot drift apart. Its own `release` job only runs
  ### for refs/tags/v*, so a d tag builds and uploads artifacts and stops there.
  build:
    name: Build
    uses: ./.github/workflows/release.yml

  ### Everything above, attached to a d tag as a prerelease (never latest).
  publish_release:
    name: Publish tagged build
    runs-on: ubuntu-latest
    needs: build
    # job will only start if there is a new d tag
    if: startsWith(github.ref, 'refs/tags/d')
    steps:
      - name: 📇 Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag name
        id: vars
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "**Commits in this tagged build:**" > release_notes.md
          # The tag before this one, or the whole history the first time round.
          PREV=$(git tag --sort=-version:refname | grep -v "^${SOURCE_TAG}$" | head -n 1)
          if [ -n "$PREV" ]; then
            git log "$PREV"..HEAD --oneline >> release_notes.md
          else
            git log --oneline >> release_notes.md
          fi
          cat release_notes.md

      - name: Download all archived artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: releasebuild-usbsid*
          merge-multiple: true

      - name: View directory content
        run: ls -R release

      - name: Create tagged build release
        uses: ncipollo/release-action@v1 # https://github.com/ncipollo/release-action
        with:
          tag: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }} snapshot
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release/*.tar.gz,release/*.zip"
          prerelease: true
          makeLatest: false
          removeArtifacts: true
          generateReleaseNotes: false
          bodyFile: "release_notes.md"
