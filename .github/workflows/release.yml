name: USBSID-Player Release

permissions:
  contents: write

env:
  BUILD_TYPE: Release

on:
  push:
    tags:
      - 'v*'   # v0.0.0, v1.2.3-rc1 and so on
  # Allows you to run this workflow manually from the Actions tab when needed
  workflow_dispatch:
  # Enables calling from other workflows
  workflow_call:

jobs:

  ### The command line player, one archive per platform.
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   shell: bash,          buildname: usbsid, asset: linux-x86_64 }
          - { os: macos-14,        shell: bash,          buildname: usbsid, asset: macos-arm64 }
          - { os: macos-15-intel,  shell: bash,          buildname: usbsid, asset: macos-x86_64 }
          - { os: windows-2022,    shell: 'msys2 {0}',   buildname: usbsid, asset: windows-x86_64 }
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: repo

      # The driver is developed alongside this repository, so it is checked out
      # here rather than pinned as a submodule: a build always gets the driver
      # as it is now, instead of whatever revision a submodule bump last
      # recorded. CMake picks it up at lib/driver/src, see CMakeLists.txt.
      - name: Checkout USBSID driver
        uses: actions/checkout@v4
        with:
          repository: LouDnl/USBSID-Pico-driver
          path: repo/lib/driver

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake build-essential libusb-1.0-0 libusb-1.0-0-dev libudev1 libudev-dev

      - name: Install dependencies (MacOs)
        if: matrix.os == 'macos-14' || matrix.os == 'macos-15-intel'
        run: |
          brew update

      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows-2022'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ninja
            zip

      - name: Configure and build ${{ matrix.buildname }}
        run: |
          pushd repo
          # `nproc` is not on macOS. getconf answers everywhere the matrix runs.
          JOBS=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)
          # REQUIRE_AUDIO=1 refuses to configure when lib/residfp is missing
          # instead of shipping a player with no --output=audio and no
          # --output=wav and only a STATUS line to say so. Every release before
          # the vendored sources were added to the repository was that player.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DDESKTOP=1 -DEMBEDDED=0 -DWEB=0 \
            -DBUILD_TESTS=0 -DPROFILE=0 -DSTRICT=1 -DREQUIRE_AUDIO=1 \
            -DEXECUTABLE=${{ matrix.buildname }}
          cmake --build build -j "$JOBS"
          popd

      - name: Package ${{ matrix.asset }}
        run: |
          # cmake -B build puts the binary in build/, not beside the sources.
          SRC=repo/build/${{ matrix.buildname }}
          if [ -f "$SRC.exe" ]; then SRC="$SRC.exe"; fi
          if [ ! -f "$SRC" ]; then
            echo "no binary at $SRC"; ls -R repo/build | head -40; exit 1
          fi
          mkdir -p stage
          cp "$SRC" stage/
          cp repo/README.md repo/LICENSE stage/ 2>/dev/null || true
          # The binary has reSIDfp and miniaudio compiled into it, so their
          # licences ship with it. reSIDfp is GPLv2, the same as this project,
          # and its COPYING has to travel with a binary that contains it.
          mkdir -p stage/licenses
          cp repo/lib/residfp/COPYING stage/licenses/reSIDfp-COPYING 2>/dev/null || true
          cp repo/lib/miniaudio/LICENSE stage/licenses/miniaudio-LICENSE 2>/dev/null || true

          # A MinGW build needs its runtime beside it or it will not start on a
          # machine without MSYS2. Take whatever it actually links against.
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            ldd "$SRC" | awk '/mingw64/ {print $3}' | while read -r dll; do
              [ -f "$dll" ] && cp "$dll" stage/
            done
          fi

          ls -l stage
          cd stage
          # A zip for Windows, a tarball elsewhere. `zip` is installed with the
          # toolchain above: the MINGW64 shell ships with neither it nor 7z.
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            zip -r "../usbsid-${{ matrix.asset }}.zip" .
          else
            tar -czf "../usbsid-${{ matrix.asset }}.tar.gz" ./*
          fi
          ls -l ../usbsid-${{ matrix.asset }}.*

      - name: Upload ${{ matrix.asset }}
        uses: actions/upload-artifact@v4
        with:
          name: releasebuild-usbsid-${{ matrix.asset }}
          path: usbsid-${{ matrix.asset }}.*
          if-no-files-found: error

  ### The browser player: the WASM and the JavaScript that drives it, as one
  ### bundle a page can be pointed at. See docs/WEB.md.
  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # The WASM build needs no driver: CMake only looks for one when
      # DESKTOP=1 AND WEB=0. But this job also builds the test suite natively,
      # further down, and that links usbsidcore which carries the driver. So the
      # driver is needed here too, and without it the whole release fails at that
      # step with "No USBSID driver found" long after the wasm has built fine.
      #
      # No `path:` on the checkout above, so this repository is at the workspace
      # root and lib/driver is where CMake looks.
      - name: Checkout USBSID driver
        uses: actions/checkout@v4
        with:
          repository: LouDnl/USBSID-Pico-driver
          path: lib/driver

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.12

      - name: Build the WASM player
        run: |
          # build-web/ is the same directory ./build.sh uses. See build.yml.
          emcmake cmake -S . -B build-web -DWEB=1 -DREQUIRE_AUDIO=1
          cmake --build build-web -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Check the wasm exports the audio API
        run: |
          # The WEB build links with an explicit EXPORTED_FUNCTIONS list, so a
          # function can compile and still not be reachable from JavaScript,
          # which looks to a page exactly like a browser that cannot do audio.
          #
          # This replaces a step that ran temp/tools/web_smoke.mjs and hid its
          # own failure behind `|| echo ... skipped`. temp/ is scratch and is not
          # in the repository, so that file never existed on a runner: the check
          # reported success for every release without ever running. A check
          # that cannot fail is worse than no check, because it is believed.
          node --input-type=module -e "
            import Module from './web/usbsid.mjs';
            const M = await Module();
            const want = ['_usp_audio_configure', '_usp_audio_take',
                          '_usp_audio_discard', '_usp_audio_clipped',
                          '_usp_audio_fm_writes'];
            const missing = want.filter((f) => typeof M[f] !== 'function');
            if (missing.length) {
              console.error('missing from the wasm:', missing.join(', '));
              process.exit(1);
            }
            console.log('the audio API is exported:', want.length, 'functions');
          "

      - name: Install dependencies for the native suite
        run: |
          # The suite links usbsidcore, which carries the USB driver, so it is a
          # DESKTOP=1 build and needs libusb. DESKTOP=0 with WEB=0 is not a
          # configuration: CMake refuses it, there being no target to build.
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake build-essential \
            libusb-1.0-0 libusb-1.0-0-dev libudev1 libudev-dev

      - name: Check the write stream is the one the suite expects
        run: |
          # The pinned hash, from the committed suite rather than from a scratch
          # tool. Both wrappers are built from the same objects as this, so a
          # release that fails here is shipping a different emulation.
          # build/ here, and not build-web/ above: this is a native build in the
          # same checkout, and the two toolchains must not share a cache.
          cmake -S . -B build -DDESKTOP=1 -DWEB=0 \
            -DBUILD_TESTS=1 -DSTRICT=1 -DREQUIRE_AUDIO=1
          cmake --build build --target usbsid-test \
            -j "$(getconf _NPROCESSORS_ONLN)"
          ./build/usbsid-test

      - name: Package the web bundle
        run: |
          # The build copies usbsid.js, .mjs and .wasm into web/, so the
          # directory is already the deliverable. See CMakeLists.txt.
          # web/README.md is the bundle's own, and is not overwritten.
          cp docs/WEB.md web/ 2>/dev/null || true
          # reSIDfp is compiled into the wasm, so its licence ships beside it.
          mkdir -p web/licenses
          cp lib/residfp/COPYING web/licenses/reSIDfp-COPYING
          # The bundle must be able to make a sound on its own, and
          # usplayer-audio.js is what does it. Named rather than trusted to the
          # glob: it is the newest file here and the one a stale checkout would
          # be missing.
          for f in usbsid.js usbsid.mjs usbsid.wasm usplayer-web.js \
                   usplayer-audio.js usplayer-adapter.js demo.html; do
            [ -f "web/$f" ] || { echo "::error::web/$f is missing from the bundle"; exit 1; }
          done
          ls -l web
          tar -czf usbsid-web.tar.gz web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: releasebuild-usbsid-web
          path: usbsid-web.tar.gz
          if-no-files-found: error

  ### Everything above, attached to a tag.
  release:
    name: Create release files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build, web]
    # job will only start if there is a new tag
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Branch latest
        id: branch_name
        run: |
          echo "IS_TAG=${{ startsWith(github.ref, 'refs/tags/') }}" >> $GITHUB_OUTPUT
          echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: 📇 Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          IS_TAG: ${{ steps.branch_name.outputs.IS_TAG }}
          SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
        if: "${{ env.IS_TAG == 'true' }}"
        id: release-notes
        run: |
          echo "**Commits in this release:**" > release_notes.md
          # The tag before this one, or the whole history the first time round.
          PREV=$(git tag --sort=-version:refname | grep -v "^${SOURCE_TAG}$" | head -n 1)
          if [ -n "$PREV" ]; then
            git log "$PREV"..HEAD --oneline >> release_notes.md
          else
            git log --oneline >> release_notes.md
          fi
          cat release_notes.md

      - name: Download all archived artifacts
        env:
          IS_TAG: ${{ steps.branch_name.outputs.IS_TAG }}
        if: "${{ env.IS_TAG == 'true' }}"
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: releasebuild-usbsid*
          merge-multiple: true

      - name: View directory content
        env:
          IS_TAG: ${{ steps.branch_name.outputs.IS_TAG }}
        if: "${{ env.IS_TAG == 'true' }}"
        run: ls -R release

      - name: Create tagged release
        id: create_release
        env:
          IS_TAG: ${{ steps.branch_name.outputs.IS_TAG }}
          SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
        if: "${{ env.IS_TAG == 'true' }}"
        uses: ncipollo/release-action@v1 # https://github.com/ncipollo/release-action
        with:
          tag: ${{ env.SOURCE_TAG }}
          name: ${{ env.SOURCE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release/*.tar.gz,release/*.zip"
          prerelease: false
          removeArtifacts: true
          generateReleaseNotes: true
          bodyFile: "release_notes.md"
